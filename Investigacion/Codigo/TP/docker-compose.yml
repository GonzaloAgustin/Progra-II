services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Comercial_Dev123!"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"Comercial_Dev123!\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 25s

  productos:
    build:
      context: ./src/net8
      dockerfile: Productos.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Productos: "Server=sqlserver,1433;Database=ComercialProductos;User Id=sa;Password=Comercial_Dev123!;TrustServerCertificate=True;Encrypt=False"
      SeedDemoData: "true"
    ports:
      - "5001:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

  inventario:
    build:
      context: ./src/net8
      dockerfile: Inventario.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Inventario: "Server=sqlserver,1433;Database=ComercialInventario;User Id=sa;Password=Comercial_Dev123!;TrustServerCertificate=True;Encrypt=False"
      Servicios__Productos: "http://productos:8080"
      Servicios__TimeoutSegundos: "5"
    ports:
      - "5002:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      productos:
        condition: service_started

  pedidos:
    build:
      context: ./src/net8
      dockerfile: Pedidos.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Pedidos: "Server=sqlserver,1433;Database=ComercialPedidos;User Id=sa;Password=Comercial_Dev123!;TrustServerCertificate=True;Encrypt=False"
      Servicios__Productos: "http://productos:8080"
      Servicios__Inventario: "http://inventario:8080"
      Servicios__TimeoutSegundos: "5"
      Reconciliacion__Habilitada: "true"
      Reconciliacion__IntervaloSegundos: "30"
    ports:
      - "5003:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      productos:
        condition: service_started
      inventario:
        condition: service_started
